# ドキュメントサイト（apps/docs-site）を Cloudflare Pages に出す（ADR-016）。
#   - 公開用リポジトリ（dotwear-dev/dotwear）の main：本番（dotwear.dev）
#   - 非公開の開発用リポジトリの PR：試し用の URL（*.dotwear.pages.dev）に出し、PR にその URL を書き込む
#     （公開用リポジトリには書き出した結果が main に直接積まれるので、試し表示は開発用の PR で行う）
# 必要な secrets：CLOUDFLARE_API_TOKEN（Pages の編集の権限だけのトークン）、CLOUDFLARE_ACCOUNT_ID
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PROJECT: dotwear

jobs:
  deploy:
    # 本番は公開用リポジトリの main からだけ。試し表示は開発用リポジトリの PR からだけ（フォークの PR には secrets がないため出さない）
    if: >-
      (github.repository == 'dotwear-dev/dotwear' && github.event_name != 'pull_request') ||
      (github.repository == 'dotwear-dev/dotwear-private' && github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 試し用の URL を PR に書き込む
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@dotwear/docs-site...
        env:
          # Dotwear Pro のページ（ADR-036・ADR-037）。リポジトリの Actions の変数で渡す。
          # PUBLIC_DOTWEAR_PRO を 1 にするまで /pro/ は「準備中」。1 にするときは、特定商取引法に基づく表記の事業者（屋号と氏名）も要る
          PUBLIC_DOTWEAR_PRO: ${{ vars.PUBLIC_DOTWEAR_PRO }}
          PUBLIC_DOTWEAR_SELLER: ${{ vars.PUBLIC_DOTWEAR_SELLER }}
          PUBLIC_DOTWEAR_SELLER_REPRESENTATIVE: ${{ vars.PUBLIC_DOTWEAR_SELLER_REPRESENTATIVE }}
      # 開発用の検査ページ（/dev/）はテストでだけ使うので、公開するサイトには含めない
      - run: rm -rf apps/docs-site/dist/dev
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 本番は main。PR は PR ごとのブランチ名で出す（Cloudflare が別の URL を割り当てる）
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
        run: |
          # secrets を設定する前（と、secrets を受け取れない実行）は出さずに終える
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の secrets がないので、サイトは出しません"
            exit 0
          fi
          # プロジェクトがなければ作る（初回だけ。2 回目以降は「すでにある」で失敗するので無視する）
          pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch main || true
          pnpm dlx wrangler@4 pages deploy apps/docs-site/dist --project-name "$PROJECT" --branch "$BRANCH" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none \
            --body "サイトの試し表示：${{ steps.deploy.outputs.url }}（コミット ${GITHUB_SHA::7}）"
